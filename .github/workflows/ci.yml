name: CI Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate:
    name: Data Validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu
          pip install PyYAML Pillow tqdm scikit-learn matplotlib numpy

      - name: Check if data exists
        run: |
          if [ -d "data/surface/test" ]; then
            echo "Data directory found"
            python scripts/validation.py ./data surface
          else
            echo "Data directory not found, skipping validation"
            exit 0
          fi

  lint:
    name: Code Quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install linting tools
        run: |
          pip install flake8 pylint

      - name: Check syntax
        run: flake8 src/ scripts/ --count --select=E9,F63,F7,F82 --show-source

      - name: Style check
        run: flake8 src/ scripts/ --count --exit-zero --max-line-length=120

  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest
    needs: validate
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install torch torchvision torchaudio --index-url https://download.pytorch.org/whl/cpu
          pip install pytest pytest-cov PyYAML Pillow tqdm scikit-learn matplotlib numpy mlflow

      - name: Run tests
        run: pytest tests/ -v --cov=src --cov-report=xml

      - name: Upload coverage
        uses: codecov/codecov-action@v4
        with:
          files: ./coverage.xml
          fail_ci_if_error: false

  build:
    name: Build Check
    runs-on: ubuntu-latest
    needs: [validate, lint, unit-tests]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          pip install PyYAML

      - name: Verify package structure
        run: |
          test -d src && test -d scripts && test -d config
          echo "Package structure verified"

      - name: Validate configuration
        run: |
          python -c "
          import yaml
          with open('config/config.yaml') as f:
              config = yaml.safe_load(f)
          assert 'data' in config
          assert 'model' in config
          assert 'training' in config
          print('Configuration valid')
          "

  test-imports:
    name: Import Tests
    runs-on: ubuntu-latest
    needs: validate
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install torch torchvision torchaudio --index-url https://download.pytorch.org/whl/cpu
          pip install PyYAML Pillow tqdm scikit-learn matplotlib numpy mlflow

      - name: Test module imports
        run: |
          python -c "from src.config import setup_logging, load_config; print('config module OK')"
          python -c "from src.dataset import MVTecDataset; print('dataset module OK')"
          python -c "from src.models import FeatureExtractor, PatchCore; print('models module OK')"
          python -c "from src.metrics import compute_metrics; print('metrics module OK')"
          python -c "from src.visualization import plot_evaluation; print('visualization module OK')"
          python -c "from src.check_device import get_device; print('check_device module OK')"
          python -c "from src.mlflow_utils import setup_mlflow; print('mlflow_utils module OK')"
