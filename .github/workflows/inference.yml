name: Run Inference

on:
  workflow_dispatch:  # Manual trigger
  schedule:
    - cron: '0 0 * * 0'  # Weekly on Sunday

jobs:
  inference:
    name: Generate Predictions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install torch torchvision torchaudio --index-url https://download.pytorch.org/whl/cpu
          pip install -q PyYAML Pillow tqdm scikit-learn matplotlib numpy

      - name: Check if model exists
        run: |
          if [ ! -f "results/models/patchcore_surface.pkl" ]; then
            echo "❌ Model not found. Training first..."
            python scripts/train.py config/config.yaml
          fi

      - name: Run inference
        run: |
          python scripts/inference.py \
            --model results/models/patchcore_surface.pkl \
            --folder data/surface/test \
            --output ./results/inference_latest \
            --visualize

      - name: Generate comparison
        run: |
          python scripts/compare_thresholds.py

      - name: Upload results
        uses: actions/upload-artifact@v3
        with:
          name: inference-results
          path: |
            results/inference_latest/
            results/figures/confusion_matrices_comparison.png
          retention-days: 30

      - name: Summary
        run: |
          echo "✅ Inference Complete"
          echo ""
          echo "Results saved:"
          ls -lah results/inference_latest/
