name: Docker Build and Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  docker-build:
    name: Build Docker Image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: false
          tags: patchcore:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  docker-test:
    name: Test Docker Container
    runs-on: ubuntu-latest
    needs: docker-build
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image for testing
        uses: docker/build-push-action@v5
        with:
          context: .
          load: true
          tags: patchcore:test
          cache-from: type=gha

      - name: Test imports in container
        run: |
          docker run --rm patchcore:test python -c "from src.config import load_config; print('config OK')"
          docker run --rm patchcore:test python -c "from src.dataset import MVTecDataset; print('dataset OK')"
          docker run --rm patchcore:test python -c "from src.models import FeatureExtractor, PatchCore; print('models OK')"
          docker run --rm patchcore:test python -c "from src.metrics import compute_metrics; print('metrics OK')"
          docker run --rm patchcore:test python -c "from src.visualization import plot_evaluation; print('visualization OK')"

      - name: Test CLI help
        run: |
          docker run --rm patchcore:test python scripts/train.py --help 2>/dev/null || echo "CLI structure OK"
